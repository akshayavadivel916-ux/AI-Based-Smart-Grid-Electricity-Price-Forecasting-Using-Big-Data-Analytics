<div class="tablewrap"><table><tr><th>Saved</th><th>Forecast date</th><th>Hour</th><th>Demand</th><th>Renewable</th><th>Temperature</th><th>Predicted price</th></tr>{% for r in rows %}<tr><td>{{r['created']}}</td><td>{{r['date']}}</td><td>{{r['hour']}}:00</td><td>{{r['demand']}}</td><td>{{r['renewable']}}</td><td>{{r['temp']}}</td><td><b>{{'%.2f'|format(r['price'])}}</b></td></tr>{% else %}<tr><td colspan="7">No predictions saved yet.</td></tr>{% endfor %}</table></div>
