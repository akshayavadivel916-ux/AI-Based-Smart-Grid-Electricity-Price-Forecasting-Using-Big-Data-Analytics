{% extends "base.html" %}{% block content %}<h1>Electricity price prediction</h1><p>Enter grid conditions for a demo estimate.</p><section class="auth wide"><form method="post"><label>Forecast date</label><input type="date" name="date" required><label>Hour (0–23)</label><input type="number" name="hour" min="0" max="23" required><label>Electricity demand (MW)</label><input type="number" name="demand" min="0" max="100000" step="any" required><label>Renewable generation (MW)</label><input type="number" name="renewable" min="0" max="100000" step="any" required><label>Temperature (°C)</label><input type="number" name="temp" min="-30" max="60" step="any" required><button class="btn">Predict price</button></form></section>{% if result %}<div class="result"><small>PREDICTED PRICE</small><h2>{{result.price}} {{result.unit}}</h2><p>{{result.note}}</p></div>{% endif %}{% endblock %}
