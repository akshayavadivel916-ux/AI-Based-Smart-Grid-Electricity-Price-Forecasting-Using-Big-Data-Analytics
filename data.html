{% extends "base.html" %}{% block content %}<h1>Sample forecast data</h1><p>Generated illustrative forecast rows; not official grid data.</p><table><tr><th>Date</th><th>Hour</th><th>Demand MW</th><th>Renewable MW</th><th>Temp °C</th><th>Price</th></tr>{% for r in rows %}<tr><td>{{r.date}}</td><td>{{r.hour}}:00</td><td>{{r.demand}}</td><td>{{r.renewable}}</td><td>{{r.temp}}</td><td>{{r.price}}</td></tr>{% endfor %}</table>{% endblock %}
